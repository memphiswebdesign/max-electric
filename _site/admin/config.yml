backend:
  name: git-gateway
  branch: master
  accept_roles:
    - admin
    - editor

media_folder: "images/uploads"
public_folder: "assets"

collections:
  - name: "page"
    label: "page"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{slug}}"
    fields:
      - {label: "Title", "name: "title", widget: "string", required: true}